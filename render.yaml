services:
  - type: web
    name: rulebook-rag
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_DENSE_EMBEDDINGS
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"
