<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rulebook QA</title>
<style>
  :root{
    --void:#0A0D16; --panel:#111726; --panel-2:#161D30; --edge:#232C43;
    --paper:#F7F5F0; --ink:#141926; --ink-soft:#3F4859;
    --chrome:#E8ECF4; --muted:#8792A6; --dim:#5C6779;
    --answered:#4FD1A0; --answered-dim:#12312A;
    --silent:#8792A6;  --silent-dim:#1D2436;
    --conflict:#F5A623; --conflict-dim:#33270F;
    --focus:#6E9BFF;
    --ui:"Avenir Next","Segoe UI Variable Text",ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif;
    --doc:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;
    --num:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void); color:var(--chrome); font-family:var(--ui);
    font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
    background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(255,255,255,.02) 31px 32px);
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 26px 90px;}
  ::selection{background:var(--conflict);color:#0A0D16;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:3px;}

  .hero{padding:74px 0 42px;border-bottom:1px solid var(--edge);}
  .kicker{font-family:var(--num);font-size:12px;color:var(--dim);letter-spacing:.04em;margin:0 0 26px;}
  .kicker b{color:var(--conflict);font-weight:400;}
  h1{font-size:clamp(38px,6.2vw,68px);line-height:.98;letter-spacing:-.035em;
     font-weight:600;margin:0 0 22px;max-width:15ch;}
  h1 em{font-style:normal;color:var(--conflict);}
  .lede{color:var(--muted);max-width:56ch;font-size:16.5px;margin:0 0 40px;}

  .standoff{display:flex;flex-wrap:wrap;border:1px solid var(--edge);
    border-radius:3px;background:var(--panel);overflow:hidden;min-height:110px;}
  .sq{flex:1 1 190px;padding:22px 24px 20px;border-left:1px solid var(--edge);min-width:0;}
  .sq:first-child{border-left:0;}
  .sq-val{font-family:var(--num);font-size:clamp(30px,4.6vw,46px);font-weight:600;
    letter-spacing:-.03em;color:var(--conflict);line-height:1;margin-bottom:10px;}
  .sq-val.wv{font-size:clamp(17px,2.2vw,22px);font-style:italic;font-family:var(--doc);
    letter-spacing:0;line-height:1.25;}
  .sq-id{font-family:var(--num);font-size:11.5px;color:var(--chrome);margin-bottom:3px;}
  .sq-src{font-size:12.5px;color:var(--dim);}
  .standoff-foot{flex:1 1 100%;padding:13px 24px;border-top:1px solid var(--edge);
    background:var(--conflict-dim);font-size:13.5px;color:#EFCC90;}

  .ask{padding:38px 0 0;}
  .ask form{display:flex;border:1px solid var(--edge);border-radius:3px;
    background:var(--panel);overflow:hidden;}
  .ask form:focus-within{border-color:var(--focus);}
  #q{flex:1;min-width:0;padding:19px 20px;font:inherit;font-size:16.5px;
    color:var(--chrome);background:transparent;border:0;}
  #q::placeholder{color:var(--dim);}
  #q:focus{outline:0;}
  #go{padding:0 30px;font:inherit;font-weight:600;font-size:15px;color:var(--void);
    background:var(--chrome);border:0;cursor:pointer;}
  #go:hover:not(:disabled){background:#fff;}
  #go:disabled{opacity:.4;cursor:default;}
  #status{min-height:22px;margin:11px 2px 0;font-family:var(--num);font-size:12px;color:var(--dim);}
  #status.err{color:#FF8B7A;}

  .probes{margin-top:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media(max-width:820px){.probes{grid-template-columns:1fr;gap:16px;}}
  .probe-h{display:flex;align-items:center;gap:8px;margin:0 0 11px;font-size:12.5px;color:var(--muted);}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .d-answered{background:var(--answered);} .d-silent{background:var(--silent);} .d-conflict{background:var(--conflict);}
  .probe{display:block;width:100%;text-align:left;font:inherit;font-size:13.5px;
    color:var(--chrome);background:var(--panel);border:1px solid var(--edge);
    border-left:2px solid var(--edge);border-radius:2px;
    padding:10px 13px;margin-bottom:7px;cursor:pointer;line-height:1.4;}
  .probe:hover{background:var(--panel-2);}
  .p-answered:hover{border-left-color:var(--answered);}
  .p-silent:hover{border-left-color:var(--silent);}
  .p-conflict:hover{border-left-color:var(--conflict);}

  #out{margin-top:52px;}
  .verdict-bar{display:flex;align-items:center;gap:15px;flex-wrap:wrap;
    padding-bottom:15px;border-bottom:1px solid var(--edge);margin-bottom:26px;}
  .stamp{font-family:var(--num);font-size:12.5px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;padding:7px 13px;border-radius:2px;border:1px solid;}
  .s-answered{color:var(--answered);border-color:#2C6A57;background:var(--answered-dim);}
  .s-not_covered{color:var(--silent);border-color:#38425A;background:var(--silent-dim);}
  .s-conflict{color:var(--conflict);border-color:#7A5A18;background:var(--conflict-dim);}
  .why{color:var(--muted);font-size:13.5px;flex:1;min-width:220px;}

  .cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:30px;align-items:start;}
  @media(max-width:940px){.cols{grid-template-columns:1fr;}}

  .sheet{background:var(--paper);color:var(--ink);border-radius:2px;padding:26px 30px;
    font-family:var(--doc);font-size:16.5px;line-height:1.72;white-space:pre-wrap;max-width:66ch;
    box-shadow:0 18px 40px -22px rgba(0,0,0,.9);}
  .sheet.is-conflict{border-top:3px solid var(--conflict);}
  .sheet.is-answered{border-top:3px solid var(--answered);}
  .sheet.is-not_covered{border-top:3px solid var(--silent);color:var(--ink-soft);}

  .ledger{margin-top:20px;border:1px solid var(--edge);border-radius:2px;overflow:hidden;}
  .ledger-h{padding:14px 18px;background:var(--conflict-dim);border-bottom:1px solid #4A3813;}
  .ledger-h strong{display:block;font-size:14.5px;color:var(--conflict);font-weight:600;}
  .ledger-h span{font-size:13px;color:#C4A46B;}
  .row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:16px;align-items:start;
    padding:16px 18px;background:var(--panel);border-top:1px solid var(--edge);}
  .row:first-child{border-top:0;}
  .row-id{font-family:var(--num);font-size:12px;color:var(--muted);padding-top:4px;}
  .row-q{font-family:var(--doc);font-size:14px;color:var(--muted);line-height:1.55;}
  .row-v{font-family:var(--num);font-size:23px;font-weight:600;color:var(--conflict);
    letter-spacing:-.02em;white-space:nowrap;text-align:right;}
  .row-v.wv{font-family:var(--doc);font-style:italic;font-size:15px;max-width:13ch;
    white-space:normal;text-align:right;line-height:1.35;}

  .ev-h{display:flex;justify-content:space-between;align-items:baseline;
    margin:0 0 13px;font-size:12.5px;color:var(--muted);}
  .ev-h span{font-family:var(--num);font-size:11.5px;color:var(--dim);}
  .slip{background:var(--paper);color:var(--ink);border-radius:2px;padding:15px 17px;
    margin-bottom:11px;box-shadow:0 12px 26px -20px rgba(0,0,0,.85);}
  .slip.cited{background:#FDF6E6;border-left:3px solid var(--conflict);}
  .slip-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;}
  .slip-id{font-family:var(--num);font-size:12.5px;font-weight:600;color:var(--ink);}
  .meter{display:flex;gap:2px;align-items:center;}
  .meter i{width:5px;height:11px;background:#D6D2C7;border-radius:1px;}
  .meter i.on{background:#6B7280;}
  .slip.cited .meter i.on{background:#C7891A;}
  .meter b{font-family:var(--num);font-size:11px;font-weight:500;color:#7B8393;margin-left:7px;}
  .slip-head{font-weight:600;font-size:14px;margin-bottom:2px;}
  .slip-meta{font-family:var(--num);font-size:10.5px;color:#8A8F9C;margin-bottom:10px;
    padding-bottom:9px;border-bottom:1px solid #E2DFD6;}
  .slip-text{font-family:var(--doc);font-size:14px;line-height:1.62;color:var(--ink-soft);margin:0;}
  .slip-text.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .more{margin-top:9px;font:inherit;font-size:12.5px;color:#8A6212;background:none;
    border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

  footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--edge);
    font-family:var(--num);font-size:11.5px;color:var(--dim);display:flex;gap:26px;flex-wrap:wrap;}
  footer a{color:inherit;}

  @media(prefers-reduced-motion:no-preference){
    .row{animation:slide .34s cubic-bezier(.2,.8,.3,1) backwards;}
    .row:nth-child(2){animation-delay:.07s;}
    .row:nth-child(3){animation-delay:.14s;}
    .sheet,.verdict-bar{animation:rise .3s cubic-bezier(.2,.8,.3,1);}
    @keyframes slide{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:none;}}
    @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  }
</style>
</head>
<body>
<div class="wrap">

  <section class="hero">
    <p class="kicker" id="kicker">indexing…</p>
    <h1>The rulebook <em>argues</em> with itself.</h1>
    <p class="lede">Ask it anything about the regulations. It answers with the clauses it used,
      it tells you when the rulebook is silent, and when two sections disagree it refuses to
      pick a side — it shows you both.</p>
    <div class="standoff" id="standoff"></div>
  </section>

  <section class="ask">
    <form id="form">
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="Ask about attendance, exams, hostel leave, fees, scholarships…" />
      <button id="go" type="submit">Ask</button>
    </form>
    <p id="status"></p>
    <div class="probes" id="probes"></div>
  </section>

  <div id="out"></div>
  <footer id="foot"></footer>
</div>

<script>
const PROBES = [
  ["conflict","Contradictions",[
    "What is the minimum attendance I need to sit the end-semester exam?",
    "How much notice must I give before staying out of the hostel overnight?",
    "What CGPA do I need to keep my merit scholarship next year?"]],
  ["answered","Answered cleanly",[
    "How many credits are required for the B.Tech degree?",
    "When does the hostel gate close at night?",
    "What is the quorum for a meeting of the Examination Committee?"]],
  ["silent","The rulebook is silent",[
    "What happens if I miss the end-semester exam because of a family wedding?",
    "Am I allowed to keep a pet cat in my hostel room?",
    "Can I use ChatGPT to help write my assignments?"]],
];
const HERO_Q = "What is the minimum attendance I need to sit the end-semester exam?";
const LABEL = {answered:"answered", not_covered:"not covered", conflict:"conflict"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function probes(){
  $("probes").innerHTML = PROBES.map(([k,title,qs]) => `
    <div>
      <p class="probe-h"><i class="dot d-${k}"></i>${title}</p>
      ${qs.map(q=>`<button class="probe p-${k}" data-q="${esc(q)}">${esc(q)}</button>`).join("")}
    </div>`).join("");
  $("probes").querySelectorAll(".probe").forEach(b =>
    b.onclick = () => { $("q").value = b.dataset.q; ask(); });
}

async function boot(){
  try{
    const h = await (await fetch("/health")).json();
    $("kicker").innerHTML =
      `${h.sections_indexed} sections indexed · ${h.indexed_words.toLocaleString()} words · ` +
      `<b>${h.contested_quantities.length} contradictions found by the detector</b>`;
    $("foot").innerHTML =
      `<span>retrieval · ${esc(h.retrieval_backend)}</span>` +
      `<span>answers · ${esc(h.answer_backend)}</span>` +
      `<span>POST /ask</span><span><a href="/docs">/docs</a></span>`;
  }catch{ $("kicker").textContent = "service unreachable"; }

  try{
    const r = await (await fetch("/ask",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:HERO_Q, top_k:5})})).json();
    if(!r.conflict) return;
    $("standoff").innerHTML = r.conflict.claims.map(c=>`
      <div class="sq">
        <div class="sq-val ${c.kind==='override'?'wv':''}">${esc(c.stated_value)}</div>
        <div class="sq-id">${esc(c.section_id)}</div>
        <div class="sq-src">${esc(c.document)}</div>
      </div>`).join("") +
      `<div class="standoff-foot">${r.conflict.claims.length} clauses, one question: ` +
      `${esc(r.conflict.topic_label.toLowerCase())}. None is written as an exception to the others.</div>`;
  }catch{}
}

function meter(v){
  const on = Math.max(1, Math.min(10, Math.round(v*10)));
  return `<span class="meter">${Array.from({length:10},(_,i)=>
    `<i class="${i<on?'on':''}"></i>`).join("")}<b>${v.toFixed(3)}</b></span>`;
}

function slip(c, cited){
  const long = c.text.length > 300;
  return `<article class="slip ${cited.has(c.section_id)?'cited':''}">
    <div class="slip-top"><span class="slip-id">${esc(c.section_id)}</span>${meter(c.similarity)}</div>
    <div class="slip-head">${esc(c.heading)}</div>
    <div class="slip-meta">${esc(c.source_file)} · ${esc(c.source_format)}</div>
    <p class="slip-text ${long?'clip':''}">${esc(c.text)}</p>
    ${long?'<button class="more">Show full clause</button>':''}
  </article>`;
}

function render(r){
  const cited = new Set(r.conflict ? r.conflict.claims.map(c=>c.section_id) : []);
  const ledger = r.conflict ? `
    <div class="ledger">
      <div class="ledger-h">
        <strong>Stated ${r.conflict.claims.length} different ways</strong>
        <span>${esc(r.conflict.topic_label)}</span>
      </div>
      ${r.conflict.claims.map(c=>`
        <div class="row">
          <div class="row-id">${esc(c.section_id)}</div>
          <div class="row-q">${esc(c.sentence)}</div>
          <div class="row-v ${c.kind==='override'?'wv':''}">${esc(c.stated_value)}</div>
        </div>`).join("")}
    </div>` : "";

  $("out").innerHTML = `
    <div class="verdict-bar">
      <span class="stamp s-${r.response_type}">${LABEL[r.response_type]}</span>
      <span class="why">${esc(r.reasoning)}</span>
    </div>
    <div class="cols">
      <div>
        <div class="sheet is-${r.response_type}">${esc(r.answer)}</div>
        ${ledger}
      </div>
      <div>
        <p class="ev-h">Passages this was built from <span>${r.citations.length} retrieved</span></p>
        ${r.citations.map(c=>slip(c,cited)).join("")}
      </div>
    </div>`;

  $("out").querySelectorAll(".more").forEach(b => b.onclick = () => {
    const p = b.previousElementSibling;
    b.textContent = p.classList.toggle("clip") ? "Show full clause" : "Show less";
  });
  $("out").scrollIntoView({behavior:"smooth", block:"start"});
}

async function ask(){
  const question = $("q").value.trim();
  if(!question) return;
  $("go").disabled = true;
  $("status").className = "";
  $("status").textContent = "searching the rulebook…";
  try{
    const res = await fetch("/ask",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question, top_k:5})});
    if(!res.ok) throw new Error(`service returned ${res.status}`);
    const data = await res.json();
    $("status").textContent = `answered in ${data.latency_ms} ms · ${data.retrieval_backend}`;
    render(data);
  }catch(e){
    $("status").className = "err";
    $("status").textContent = `${e.message} — check the server is running, then ask again.`;
  }finally{ $("go").disabled = false; }
}

$("form").onsubmit = e => { e.preventDefault(); ask(); };
probes(); boot();
</script>
</body>
</html>
